name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r src/sample_agent/requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src/sample_agent
